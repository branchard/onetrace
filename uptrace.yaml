##
## Default onetrace configuration.
##
## All services run in the same container, so they talk to each other over
## localhost. Postgres/ClickHouse/Redis are not exposed outside the container,
## so these default credentials are for internal use only.
##
## To customize, mount your own file over /etc/uptrace/uptrace.yaml (and set the
## matching POSTGRES_*/CLICKHOUSE_* environment variables so the two agree).
## Generated with `uptrace config create`; see https://uptrace.dev/get/hosted/config.
##

service:
  env: production
  secret: ${SECRET}

site:
  url: ${SITE_URL:http://localhost:14318}

listen:
  http:
    addr: ':14318'
  grpc:
    addr: ':4317'

auth: {}

# Bootstrap data created on first startup. Change the passwords/tokens (or
# mount your own config) before exposing this beyond local use.
seed_data:
  update: true
  delete: true
  users:
    - key: user1
      name: Admin
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
      email_confirmed: true
  user_tokens:
    - key: user_token1
      user_key: user1
      token: user1_secret
  orgs:
    - key: org1
      name: ${ORG_NAME}
  org_users:
    - key: org_user1
      org_key: org1
      user_key: user1
      role: owner
  projects:
    - key: project1
      name: ${PROJECT_NAME}
      org_key: org1
  project_tokens:
    - key: project_token1
      project_key: project1
      token: project1_secret
  project_users:
    - key: project_user1
      project_key: project1
      org_user_key: org_user1
      perm_level: admin

ch_cluster:
  cluster: uptrace1
  replicated: false
  distributed: false
  shards:
    - replicas:
        - addr: localhost:9000
          database: uptrace
          user: uptrace
          password: uptrace
          dial_timeout: 3s
          write_timeout: 5s
          max_retries: 3
          max_execution_time: 15s

pg:
  addr: localhost:5432
  user: uptrace
  password: uptrace
  database: uptrace

ch_schema:
  compression: ZSTD(1)
  spans_index: { storage_policy: default }
  spans_data: { storage_policy: default }
  span_links: { storage_policy: default }
  logs_index: { storage_policy: default }
  logs_data: { storage_policy: default }
  events_index: { storage_policy: default }
  events_data: { storage_policy: default }
  metrics: { storage_policy: default }

redis_cache:
  addrs:
    1: localhost:6379
  username: ''
  password: ''
  db: 0

# No mail server is bundled in this image.
mailer:
  smtp:
    enabled: false

self_monitoring:
  dsn: http://project1_secret@localhost?grpc=4317

logging:
  level: WARN

license:
  key: ''
