##
## Default onetrace configuration.
##
## All services run in the same container, so they talk to each other over localhost. Postgres/ClickHouse/Redis are
## not exposed outside the container, so these default credentials are for internal use only.
##
## To customize, mount your own file over /etc/uptrace/uptrace.yaml (and set the matching POSTGRES_*/CLICKHOUSE_*
## environment variables so the two agree).
## Generated with `uptrace config create`; see https://uptrace.dev/get/hosted/config.
##

service:
  env: production
  secret: ${SECRET}

site:
  url: ${SITE_URL:http://localhost:14318}

listen:
  http:
    addr: ':14318'
  grpc:
    addr: ':4317'

auth: {}

# Bootstrap data created on first startup. Change the passwords/tokens (or mount your own config) before exposing this
# beyond local use.
seed_data:
  update: true
  delete: true
  users:
    - key: user1
      name: Admin
      email: ${ADMIN_EMAIL}
      password: ${ADMIN_PASSWORD}
      email_confirmed: true
  user_tokens:
    - key: user_token1
      user_key: user1
      token: ${ADMIN_TOKEN}
  orgs:
    - key: org1
      name: ${ORG_NAME}
  org_users:
    - key: org_user1
      org_key: org1
      user_key: user1
      role: viewer
  projects:
    - key: project1
      name: ${PROJECT_NAME}
      org_key: org1
  project_tokens:
    - key: project_token1
      project_key: project1
      token: ${PROJECT_TOKEN}
  project_users:
    - key: project_user1
      project_key: project1
      org_user_key: org_user1
      perm_level: view

ch_cluster:
  cluster: uptrace1
  replicated: false
  distributed: false
  shards:
    - replicas:
        - addr: localhost:9000
          database: uptrace
          user: uptrace
          password: ${CLICKHOUSE_PASSWORD}
          dial_timeout: 3s
          write_timeout: 5s
          max_retries: 3
          max_execution_time: 15s

pg:
  addr: localhost:5432
  user: uptrace
  password: ${POSTGRES_PASSWORD}
  database: uptrace

ch_schema:
  compression: ZSTD(1)
  spans_index: { storage_policy: default }
  spans_data: { storage_policy: default }
  span_links: { storage_policy: default }
  logs_index: { storage_policy: default }
  logs_data: { storage_policy: default }
  events_index: { storage_policy: default }
  events_data: { storage_policy: default }
  metrics: { storage_policy: default }

# In-memory ingestion buffers. The defaults below are Uptrace's own; entrypoint.sh lowers them when LOW_MEMORY is set.
# max_insert_size is deliberately left alone: smaller batches would mean more parts, hence more merge pressure, which
# works against the reduced background pools of the low-memory profile.
spans:
  max_buffered_records: ${UPTRACE_MAX_BUFFERED_RECORDS:100e3}
logs:
  max_buffered_records: ${UPTRACE_MAX_BUFFERED_RECORDS:100e3}
events:
  max_buffered_records: ${UPTRACE_MAX_BUFFERED_RECORDS:100e3}
metrics:
  max_buffered_records: ${UPTRACE_MAX_BUFFERED_RECORDS:100e3}
  max_cumulative_timeseries: ${UPTRACE_MAX_CUMULATIVE_TIMESERIES:1e6}

# Per-query resource ceilings.
trace:
  query_limit: ${UPTRACE_QUERY_LIMIT:200000}
  max_memory_usage_bytes: ${UPTRACE_MAX_QUERY_MEMORY:200000000}

redis_cache:
  addrs:
    1: localhost:6379
  username: ''
  password: ''
  db: 0

# No mail server is bundled in this image. Point MAILER_HOST at your relay and the mailer turns itself on
# (entrypoint.sh derives `enabled` from it). Needed for password resets, user invitations and alert notifications.
#
# Three things about Uptrace 2.0.3's mailer, all found the hard way — send errors are logged at INFO, below this file's
# WARN level, while the API still returns 200:
#   - Authentication is mandatory. There is no way to talk to a relay that does not offer AUTH: an empty auth_type is
#     rejected with `unsupported SMTP AUTH type ""`, and credentials are never sent over an unencrypted connection.
#   - `server_name_override` below is not cosmetic. Without it Uptrace hands Go a tls.Config with neither ServerName
#     nor InsecureSkipVerify, and every send fails with "tls: either ServerName or InsecureSkipVerify must be
#     specified". Pinning it to the host restores the verification Go would do by default.
#   - There is no implicit-TLS mode, so port 465 does not work; use 587 (STARTTLS).
mailer:
  smtp:
    enabled: ${MAILER_ENABLED:false}
    host: ${MAILER_HOST:localhost}
    port: ${MAILER_PORT:587}
    auth_type: ${MAILER_AUTH_TYPE:PLAIN}
    username: ${MAILER_USERNAME:}
    password: ${MAILER_PASSWORD:}
    from: ${MAILER_FROM:no-reply@uptrace.local}
    tls:
      # STARTTLS is always used. MAILER_TLS_INSECURE=true keeps the encryption but skips certificate verification, for
      # a self-signed relay on a trusted network — that is what the bundled dev sink needs.
      insecure_skip_verify: ${MAILER_TLS_INSECURE:false}
      server_name_override: ${MAILER_HOST:localhost}

self_monitoring:
  disabled: ${UPTRACE_SELF_MONITORING_DISABLED:false}
  dsn: http://${PROJECT_TOKEN}@localhost?grpc=4317

# Verbosity of Uptrace's own log output — the [Uptrace] lines in `docker logs` — not the telemetry it stores. DEBUG,
# INFO, WARN (Uptrace's default is INFO) or ERROR. WARN keeps the container quiet, but hides anything Uptrace treats as
# routine: failed email sends are logged at INFO, so raise this before debugging a mailer.
logging:
  level: WARN

license:
  key: ''
