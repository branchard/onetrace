# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  onetrace:
    build:
      context: .
      args:
        VERSION: dev
        VCS_REF: ""
        BUILD_DATE: ""
        UPTRACE_VERSION: ${UPTRACE_VERSION:-latest}
    ports:
      - "8080:14318" # Uptrace UI + OTLP/HTTP → http://localhost:8080
      - "8081:4317"  # OTLP/gRPC
    environment:
      SECRET: change-me-in-production
      SITE_URL: http://localhost:8080
      ADMIN_EMAIL: admin@uptrace.local
      ADMIN_PASSWORD: admin
      ADMIN_TOKEN: change-me-in-production
      ORG_NAME: MyOrg
      PROJECT_NAME: MyProject
      PROJECT_TOKEN: change-me-in-production
      LOW_MEMORY: ${LOW_MEMORY-}
      MAILER_HOST: ${MAILER_HOST-maildev}
      MAILER_PORT: ${MAILER_PORT-25}
      MAILER_FROM: ${MAILER_FROM-no-reply@uptrace.local}
      MAILER_USERNAME: ${MAILER_USERNAME-dev}
      MAILER_PASSWORD: ${MAILER_PASSWORD-dev}
      # The sink's certificate is self-signed. Never carry this to a real relay.
      MAILER_TLS_INSECURE: ${MAILER_TLS_INSECURE-true}
    volumes:
      - data:/volumes
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:14318/" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Synthetic traffic for the local stack: a frontend → api → db/cache request flow, emitting correlated traces, span
  # events, logs and metrics for all of them, plus a recurring database incident so the error views have a real cluster
  # to group rather than uniform background noise.
  #
  # See demo.ts. It has no dependencies — Bun's fetch is enough, and Uptrace's OTLP/HTTP receiver takes plain JSON — so
  # there is nothing to install and no lockfile to keep up to date.
  demo:
    image: oven/bun:1-alpine
    depends_on:
      onetrace:
        condition: service_healthy
    environment:
      OTLP_ENDPOINT: http://onetrace:14318
      PROJECT_TOKEN: ${PROJECT_TOKEN:-change-me-in-production}
      DEMO_RATE: 5          # simulated requests per second
      DEMO_CYCLE_S: 120     # one incident every two minutes...
      DEMO_INCIDENT_S: 30   # ...lasting thirty seconds
    volumes:
      - ./demo.ts:/demo.ts:ro
    command: [ "bun", "/demo.ts" ]

  # Catches everything the Uptrace mailer sends, so notifications can be exercised without a real relay.
  # Read them at http://localhost:8025 — nothing leaves the machine.
  #
  # smtp4dev rather than mailpit or mailhog: Uptrace always issues SMTP AUTH and go-mail refuses to send credentials
  # over an unencrypted connection, so the sink has to offer STARTTLS. smtp4dev generates its own self-signed
  # certificate at startup, which the other two would need supplied as files.
  maildev:
    image: rnwood/smtp4dev:v3
    environment:
      ServerOptions__TlsMode: StartTls
      ServerOptions__Port: 25
    ports:
      - "8025:80" # web UI; SMTP stays on 25, container-internal

volumes:
  data:
