# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  onetrace:
    build:
      context: .
      args:
        VERSION: dev
        VCS_REF: ""
        BUILD_DATE: ""
        UPTRACE_VERSION: ${UPTRACE_VERSION:-latest}
    ports:
      - "8080:14318" # Uptrace UI + OTLP/HTTP → http://localhost:8080
      - "8081:4317"  # OTLP/gRPC
    environment:
      SECRET: change-me-in-production
      SITE_URL: http://localhost:8080
      ADMIN_EMAIL: admin@uptrace.local
      ADMIN_PASSWORD: admin
      ADMIN_TOKEN: change-me-in-production
      ORG_NAME: MyOrg
      PROJECT_NAME: MyProject
      PROJECT_TOKEN: change-me-in-production
      LOW_MEMORY: ${LOW_MEMORY:-1}
    volumes:
      - data:/volumes
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14318/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Synthetic traffic for the local stack: a frontend → api → db/cache request
  # flow, emitting correlated traces, span events, logs and metrics for all of
  # them, plus a recurring database incident so the error views have a real
  # cluster to group rather than uniform background noise.
  #
  # See demo.ts. It has no dependencies — Bun's fetch is enough and Uptrace's
  # OTLP/HTTP receiver takes plain JSON — so there is nothing to install and no
  # lockfile to keep up to date.
  demo:
    image: oven/bun:1-alpine
    depends_on:
      onetrace:
        condition: service_healthy
    environment:
      OTLP_ENDPOINT: http://onetrace:14318
      PROJECT_TOKEN: ${PROJECT_TOKEN:-change-me-in-production}
      DEMO_RATE: 5          # simulated requests per second
      DEMO_CYCLE_S: 120     # one incident every two minutes...
      DEMO_INCIDENT_S: 30   # ...lasting thirty seconds
    volumes:
      - ./demo.ts:/demo.ts:ro
    command: ["bun", "/demo.ts"]

volumes:
  data:
