# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
services:
  onetrace:
    build:
      context: .
      args:
        VERSION: dev
        VCS_REF: ""
        BUILD_DATE: ""
        UPTRACE_VERSION: ${UPTRACE_VERSION:-latest}
    ports:
      - "8080:14318" # Uptrace UI + OTLP/HTTP → http://localhost:8080
      - "8081:4317"  # OTLP/gRPC
    environment:
      SECRET: change-me-in-production
      SITE_URL: http://localhost:8080
      ADMIN_EMAIL: admin@uptrace.local
      ADMIN_PASSWORD: admin
      ADMIN_TOKEN: change-me-in-production
      ORG_NAME: MyOrg
      PROJECT_NAME: MyProject
      PROJECT_TOKEN: change-me-in-production
      LOW_MEMORY: ${LOW_MEMORY:-1}
    volumes:
      - data:/volumes
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14318/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Sends a continuous stream of synthetic logs, so there's something to look
  # at in the UI right after startup. Uses the official OpenTelemetry load
  # generator (no custom image needed). The DSN below reuses onetrace's own
  # PROJECT_TOKEN, so it stays in sync automatically.
  demo-logs:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    depends_on:
      onetrace:
        condition: service_healthy
    command:
      - logs
      - --duration=inf
      - --rate=2
      - --service=demo
      - --otlp-endpoint=onetrace:4317
      - --otlp-insecure
      - --otlp-header=uptrace-dsn="http://${PROJECT_TOKEN:-change-me-in-production}@onetrace:4317/1"

  # Same idea, but for metrics. telemetrygen only generates one signal type per
  # process, hence one service per signal.
  demo-metrics:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    depends_on:
      onetrace:
        condition: service_healthy
    command:
      - metrics
      - --duration=inf
      - --rate=1
      - --metric-type=Gauge
      - --service=demo
      - --otlp-endpoint=onetrace:4317
      - --otlp-insecure
      - --otlp-header=uptrace-dsn="http://${PROJECT_TOKEN:-change-me-in-production}@onetrace:4317/1"

  # And traces. Each trace is a root span plus --child-spans children (1 by default), so this sends roughly
  # 2 spans/s — enough to populate the Traces view with a real parent/child
  # waterfall.
  demo-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
    depends_on:
      onetrace:
        condition: service_healthy
    command:
      - traces
      - --duration=inf
      - --rate=1
      - --service=demo
      - --otlp-endpoint=onetrace:4317
      - --otlp-insecure
      - --otlp-header=uptrace-dsn="http://${PROJECT_TOKEN:-change-me-in-production}@onetrace:4317/1"

  # And events. telemetrygen has no events signal, and in OTLP an event is not a
  # top-level record anyway: it is attached to a span. So this posts OTLP/JSON
  # directly — one `checkout` span carrying two named events, which Uptrace files
  # under Events rather than Traces. (An event named `exception` is special:
  # Uptrace turns it into an error log instead.)
  demo-events:
    image: curlimages/curl:latest
    depends_on:
      onetrace:
        condition: service_healthy
    environment:
      PROJECT_TOKEN: ${PROJECT_TOKEN:-change-me-in-production}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while :; do
          now=$$(date +%s)000000000
          # Trace and span ids are 16 and 8 random bytes, hex-encoded.
          tid=$$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          sid=$$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')
          curl -sS -o /dev/null -X POST http://onetrace:14318/v1/traces \
            -H 'Content-Type: application/json' \
            -H "uptrace-dsn: http://$${PROJECT_TOKEN}@onetrace:14318/1" \
            -d "$$(printf '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"demo"}}]},"scopeSpans":[{"spans":[{"traceId":"%s","spanId":"%s","name":"checkout","kind":2,"startTimeUnixNano":"%s","endTimeUnixNano":"%s","events":[{"timeUnixNano":"%s","name":"cart.updated","attributes":[{"key":"cart.items","value":{"intValue":"3"}}]},{"timeUnixNano":"%s","name":"payment.authorized","attributes":[{"key":"payment.amount","value":{"doubleValue":42.5}}]}]}]}]}]}' "$$tid" "$$sid" "$$now" "$$now" "$$now" "$$now")"
          sleep 5
        done

volumes:
  data:
