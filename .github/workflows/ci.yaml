name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 1' # Check for new Uptrace releases every Monday at 1:30 AM UTC

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      should_push: ${{ steps.decide.outputs.should_push }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: "Decide" below diffs against an arbitrary past commit.
          fetch-depth: 0

      # Uptrace publishes betas/rcs as regular (non-flagged) GitHub releases,
      # so "latest release" isn't reliable. Only consider clean X.Y.Z tags
      # from the Docker Hub image we actually pin in the Dockerfile.
      - name: Determine latest stable Uptrace version
        id: uptrace
        run: |
          url="https://hub.docker.com/v2/repositories/uptrace/uptrace/tags?page_size=100"
          tags=""
          while [ -n "$url" ] && [ "$url" != "null" ]; do
            page=$(curl -fsSL "$url")
            tags="$tags $(echo "$page" | jq -r '.results[].name')"
            url=$(echo "$page" | jq -r '.next')
          done
          version=$(echo "$tags" | tr ' ' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$version" ]; then
            echo "Could not determine the latest stable Uptrace version" >&2
            exit 1
          fi
          echo "Latest stable Uptrace version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skip publishing only when both the resolved Uptrace version and
      # the tracked source files are unchanged since whatever we last published as ":latest".
      - name: Decide whether to publish
        id: decide
        run: |
          set -e
          image=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          uptrace_version="${{ steps.uptrace.outputs.version }}"

          last_labels=$(docker buildx imagetools inspect "${image}:latest" --format '{{json .Image.Config.Labels}}' 2>/dev/null || true)

          if [ -z "$last_labels" ] || [ "$last_labels" = "null" ]; then
            echo "No image published yet."
            revision=0
            should_push=true
          else
            last_uptrace=$(echo "$last_labels" | jq -r '."io.onetrace.uptrace.version" // empty')
            last_version=$(echo "$last_labels" | jq -r '."org.opencontainers.image.version" // empty')
            last_sha=$(echo "$last_labels" | jq -r '."org.opencontainers.image.revision" // empty')
            last_revision="${last_version##*-}"

            if [ "$last_uptrace" != "$uptrace_version" ]; then
              echo "Uptrace version changed: $last_uptrace -> $uptrace_version"
              revision=0
              should_push=true
            elif [ -n "$last_sha" ] && git diff --quiet "$last_sha" HEAD -- Dockerfile entrypoint.sh uptrace.yaml 2>/dev/null; then
              echo "Uptrace version unchanged ($uptrace_version) and no relevant file changed since $last_sha."
              revision="$last_revision"
              should_push=false
            else
              echo "Relevant files changed since $last_sha (or it couldn't be compared)."
              revision=$((last_revision + 1))
              should_push=true
            fi
          fi

          version="${uptrace_version}-${revision}"
          echo "Version: $version, should_push: $should_push"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_push=$should_push" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --build-arg UPTRACE_VERSION=${{ steps.uptrace.outputs.version }} \
            --build-arg VERSION=${{ steps.decide.outputs.version }} \
            --build-arg VCS_REF=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t onetrace:ci .

      - name: Save image to a tarball
        run: docker save onetrace:ci -o onetrace.tar

      - uses: actions/upload-artifact@v7
        with:
          name: onetrace-image
          path: onetrace.tar
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: onetrace-image

      - name: Load image
        run: docker load -i onetrace.tar

      - name: Start container
        run: |
          docker run -d --name onetrace -p 8080:14318 -p 8081:4317 \
          -e SECRET=change-me-in-production \
          -e SITE_URL=http://localhost:8080 \
          -e ADMIN_EMAIL=admin@uptrace.local \
          -e ADMIN_PASSWORD=admin \
          -e ADMIN_TOKEN=change-me-in-production \
          -e ORG_NAME=MyOrg \
          -e PROJECT_NAME=MyProject \
          -e PROJECT_TOKEN=change-me-in-production \
          onetrace:ci

      - name: Wait for the UI to come up
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && { echo "ready after ${i}s"; exit 0; }
            sleep 2
          done
          echo "onetrace did not become ready in time"
          exit 1

      - name: UI responds
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
          test "$code" = "200"

      - name: OTLP/HTTP endpoint is live
        run: |
          # An empty payload is rejected (400), which still proves the OTLP
          # receiver is up and parsing requests rather than refusing the connection.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/v1/traces \
            -H 'Content-Type: application/x-protobuf' --data-binary '')
          case "$code" in 200|400) ;; *) echo "unexpected status $code"; exit 1 ;; esac

      - name: OTLP/gRPC port is open
        run: nc -z -w2 127.0.0.1 8081

      - name: Internal services (Postgres/ClickHouse/Redis) are healthy
        run: |
          docker exec onetrace /usr/local/bin/redis-cli ping
          docker exec onetrace /uptrace --config=/etc/uptrace/uptrace.yaml pg ping
          docker exec onetrace /uptrace --config=/etc/uptrace/uptrace.yaml ch ping

      - name: Container shuts down cleanly
        run: |
          docker stop -t 15 onetrace
          code=$(docker inspect -f '{{.State.ExitCode}}' onetrace)
          test "$code" = "0"

      - name: Dump logs on failure
        if: failure()
        run: docker logs onetrace || true

  push:
    needs: [build, test]
    if: >
      needs.build.outputs.should_push == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: onetrace-image

      - name: Load image
        run: docker load -i onetrace.tar

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          image=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          version="${{ needs.build.outputs.version }}"
          uptrace_version="${version%-*}"   # 2.0.3-1 -> 2.0.3
          minor="${uptrace_version%.*}"     # 2.0.3   -> 2.0
          major="${minor%.*}"               # 2.0     -> 2

          for tag in "$version" "$uptrace_version" "$minor" "$major" latest; do
            docker tag onetrace:ci "${image}:${tag}"
            docker push "${image}:${tag}"
          done

  release:
    needs: [ build, push ]
    if: needs.push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
